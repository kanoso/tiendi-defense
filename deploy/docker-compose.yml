# Runs the co-op server on its own, apart from anything else on the machine.
# HOST_PORT is the port players open in their browser.
name: tower-defense-heroes
services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tower-defense-heroes:latest
    restart: unless-stopped
    environment:
      # Sites, besides this server, whose pages may use it. Comma-separated.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      # Player progress. Kept apart from the image so it survives every update.
      - progress:/app/data
    ports:
      - "${HOST_PORT:-8787}:8787"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0

volumes:
  progress:
