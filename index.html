<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#1b1f17" />
    <link rel="icon" type="image/png" href="assets/sprites/hero-warrior.png" />
    <title>Tower Defense Heroes</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1f17;
        /* The game handles every touch itself: no page scroll, zoom or pull-to-refresh. */
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100vw;
        /* dvh follows the mobile address bar as it shows and hides. */
        height: 100vh;
        height: 100dvh;
      }
      /* The map is wide: on a phone held upright it would be too small to play. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #1b1f17;
        color: #f4f1e8;
        font: 600 20px/1.4 system-ui, sans-serif;
        text-align: center;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Gira el dispositivo para jugar en horizontal.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
